[build-system]
requires = ["hatchling>=1.25.0", "uv-dynamic-versioning>=0.7.0"]
build-backend = "hatchling.build"

[project]
name = "dataspector"
dynamic = ["version"]
description = "Read COBOL copybooks and convert mainframe EBCDIC, COMP-3, and fixed-width extracts to CSV, Parquet, JSON, Excel, or pandas — with format-agnostic data-integrity and Pandera validation."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Aaron Berndsen", email = "aaron.berndsen@gmail.com" },
]
maintainers = [
    { name = "Aaron Berndsen", email = "aaron.berndsen@gmail.com" },
]
keywords = [
    "cobol",
    "cobol-copybook",
    "copybook",
    "copybook-parser",
    "read-cobol",
    "mainframe",
    "mainframe-extract",
    "ebcdic",
    "comp-3",
    "packed-decimal",
    "zoned-decimal",
    "ibm-hfp",
    "fixed-width",
    "cobol-to-csv",
    "cobol-to-parquet",
    "data-conversion",
    "data-quality",
    "data-validation",
    "pandas",
    "pandera",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "chardet>=5.0.0",
    "jsonargparse>=4.30.0",
    "loguru>=0.7.0",
    "numpy>=2.0.0",
    "openpyxl>=3.1.0",
    "pandas>=2.1.0",
    "pandera>=0.36.0",
    "sqlalchemy>=2.1.9",
    "xlsxwriter>=3.3.3",
]

[project.urls]
Homepage = "https://github.com/aberndsen/dataspector"
Documentation = "https://aberndsen.github.io/dataspector/"
Repository = "https://github.com/aberndsen/dataspector"
Issues = "https://github.com/aberndsen/dataspector/issues"

[project.optional-dependencies]
odbc = [
    "pyodbc>=5.5.0",
]
docs = [
    "numpydoc>=1.7.0",
    "pydata-sphinx-theme>=0.15.0",
    "sphinx>=7.4.0",
]

[project.scripts]
dataspector = "dataspector.cli:main"
coboller = "dataspector.cli:coboller_main"

[dependency-groups]
dev = [
    "assertpy>=1.1",
    "ipython>=9.18.1",
    "numpydoc>=1.7.0",
    "pydata-sphinx-theme>=0.15.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "sphinx>=7.4.0",
    "ty>=0.0.1a1",
]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["src/dataspector"]

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
fallback-version = "0.0.0"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",  # handled by formatter / docstrings
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-v", "--cov=dataspector", "--cov-report=term-missing"]

[tool.coverage.run]
source = ["src/dataspector"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ty.environment]
python-version = "3.12"
